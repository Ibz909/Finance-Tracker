<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PencePlot: your money, in focus. Track your income, spending, budgets and savings goals. Your data stays in your browser."
    />
    <meta name="application-name" content="PencePlot" />
    <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PencePlot | Personal Finance</title>
    <!--
      Applies the saved theme before the first paint to avoid a flash of the
      wrong theme. Mirrors src/services/theme.ts: an unknown or missing value
      means "system". Keep the storage key in sync with storageKeys.ts.
    -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = window.localStorage.getItem('finance-tracker:theme');
        } catch (error) {
          // Storage unavailable: fall through to the system setting.
        }
        var isDark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
